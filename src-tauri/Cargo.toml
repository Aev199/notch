[package]
name = "notch"
version = "0.1.0"
description = "Portable Dynamic Island-style notch for Windows: screenshot shelf, clipboard history, quick translator"
authors = ["Aev199"]
license = "MIT"
edition = "2021"

[lib]
name = "notch_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notch-core = { path = "../crates/core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-drag = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native TLS = SChannel on Windows: no C toolchain, smaller binary than rustls+ring.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
clipboard-master = "4"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_System_DataExchange",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_Security",
]

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
strip = true
