name: windows-portable

# One build per push. Pull requests from branches of this repository are
# already built by their push, so there is no separate pull_request trigger.
on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      release:
        description: "Опубликовать GitHub Release с notch.exe"
        type: boolean
        default: false
      notes:
        description: "Заметки к выпуску (пункты через ;)"
        type: string
        default: ""

# Builds only read the repository; the release job asks for more itself.
permissions:
  contents: read

# A newer push to the same branch makes the older build pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

# Actions are pinned to commits (the tag is in the comment): a moved tag
# cannot change what runs here.
jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.stamp.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            src-tauri
            crates/core

      - name: Core lints
        run: cargo clippy --manifest-path crates/core/Cargo.toml --all-targets -- -D warnings

      - name: Core tests
        run: cargo test --manifest-path crates/core/Cargo.toml

      # The build number is the version the app compares when updating;
      # it lands in the EXE's file properties too.
      - name: Stamp version
        id: stamp
        shell: pwsh
        run: |
          $version = "0.1.${{ github.run_number }}"
          "version=$version" >> $env:GITHUB_OUTPUT
          $path = "src-tauri/tauri.conf.json"
          $conf = Get-Content $path -Raw | ConvertFrom-Json
          $conf.version = $version
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Resolve-Path $path), ($conf | ConvertTo-Json -Depth 32), $utf8)

      - name: Install frontend deps
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Build portable exe
        # bundle.active = false: no MSI/NSIS, just target/release/notch.exe
        run: npx tauri build

      - name: Report size
        shell: pwsh
        run: |
          $exe = Get-Item src-tauri/target/release/notch.exe
          "notch.exe: {0:N2} MB" -f ($exe.Length / 1MB) | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      # Every build is ~50 MB of storage. Released builds live on in the
      # release itself, so the artifact only has to outlast testing.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notch-portable-${{ github.run_number }}
          path: src-tauri/target/release/notch.exe
          retention-days: 7
          compression-level: 0

  # The only job that may write to the repository, and it runs no project
  # code: it publishes the EXE the build job made.
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: notch-portable-${{ github.run_number }}

      # notes.md for the release page, latest.json for the app's updater.
      - name: Release notes and manifest
        env:
          NOTES: ${{ inputs.notes }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          items=$(printf '%s' "$NOTES" | jq -Rsc 'split(";") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          {
            printf '%s' "$items" | jq -r '.[] | "- " + .'
            printf '\nОдин файл, без установки. Нужен WebView2 Runtime (есть в Windows 10/11 вместе с Edge).\n'
          } > notes.md
          sha=$(sha256sum notch.exe | cut -d' ' -f1)
          jq -n --arg version "$VERSION" --arg sha256 "$sha" --argjson notes "$items" \
            '{version: $version, sha256: $sha256, notes: $notes}' > latest.json
          cat latest.json

      # With the NOTCH_SIGNING_KEY secret (an Ed25519 private key in PEM) the
      # manifest is signed; the app checks it once its public key is set in
      # crates/core/src/update.rs. See "Подпись выпусков" in the README.
      - name: Sign the manifest
        env:
          SIGNING_KEY: ${{ secrets.NOTCH_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "NOTCH_SIGNING_KEY is not set: the release is not signed" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          key=$(mktemp)
          printf '%s\n' "$SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in latest.json -out latest.json.sig
          rm -f "$key"
          test "$(wc -c < latest.json.sig)" -eq 64

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Notch ${{ needs.build.outputs.version }}
          body_path: notes.md
          files: |
            notch.exe
            latest.json
            latest.json.sig
