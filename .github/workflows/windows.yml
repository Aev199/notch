name: windows-portable

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Опубликовать GitHub Release с notch.exe"
        type: boolean
        default: false
      notes:
        description: "Заметки к выпуску (пункты через ;)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/core

      - name: Core tests
        run: cargo test --manifest-path crates/core/Cargo.toml

      # The build number is the version the app compares when updating;
      # it lands in the EXE's file properties too.
      - name: Stamp version
        shell: pwsh
        run: |
          $version = "0.1.${{ github.run_number }}"
          "NOTCH_VERSION=$version" >> $env:GITHUB_ENV
          $path = "src-tauri/tauri.conf.json"
          $conf = Get-Content $path -Raw | ConvertFrom-Json
          $conf.version = $version
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Resolve-Path $path), ($conf | ConvertTo-Json -Depth 32), $utf8)

      - name: Install frontend deps
        run: npm ci

      - name: Build portable exe
        # bundle.active = false: no MSI/NSIS, just target/release/notch.exe
        run: npx tauri build

      - name: Report size
        shell: pwsh
        run: |
          $exe = Get-Item src-tauri/target/release/notch.exe
          "notch.exe: {0:N2} MB" -f ($exe.Length / 1MB) | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: notch-portable-${{ github.run_number }}
          path: src-tauri/target/release/notch.exe

      # notes.md for the release page, latest.json for the app's updater.
      - name: Release notes and manifest
        if: github.event_name == 'workflow_dispatch' && inputs.release
        shell: pwsh
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          $items = @($env:NOTES -split ';' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          $body = ($items | ForEach-Object { "- $_" }) -join "`n"
          $body += "`n`nОдин файл, без установки. Нужен WebView2 Runtime (есть в Windows 10/11 вместе с Edge)."
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Join-Path $PWD "notes.md"), $body, $utf8)
          $sha = (Get-FileHash src-tauri/target/release/notch.exe -Algorithm SHA256).Hash.ToLower()
          $manifest = [ordered]@{ version = $env:NOTCH_VERSION; sha256 = $sha; notes = $items } | ConvertTo-Json -Depth 4
          [System.IO.File]::WriteAllText((Join-Path $PWD "latest.json"), $manifest, $utf8)
          Get-Content latest.json

      - name: Release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Notch 0.1.${{ github.run_number }}
          body_path: notes.md
          files: |
            src-tauri/target/release/notch.exe
            latest.json
